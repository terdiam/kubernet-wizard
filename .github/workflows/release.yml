name: Release

# Push a tag like v0.2.0 (stable) or v0.2.0-beta.1 (beta).
# Run it manually (workflow_dispatch) to build and download installers without
# publishing a release.
#
# Required repository settings:
#   secrets.MINISIGN_SECRET_KEY  content of a key made with `minisign -G -W` (unencrypted;
#                                protected by GitHub secret storage)
#   vars.KW_UPDATE_PUBKEY        the matching public key (base64 line from minisign.pub),
#                                embedded into the app to verify updates
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-aarch64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x86_64 }
          # Built on Rocky 9 (glibc 2.34) so binaries, .deb and .rpm also run on RHEL 9.
          - { os: ubuntu-24.04, container: "rockylinux:9", target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      KW_UPDATE_PUBKEY: ${{ vars.KW_UPDATE_PUBKEY }}
    steps:
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --allowerasing gcc gcc-c++ clang make perl git curl \
            fontconfig-devel wayland-devel libxkbcommon-devel libxkbcommon-x11-devel \
            libX11-devel libxcb-devel openssl-devel libzstd-devel alsa-lib-devel vulkan-loader \
            pkgconf-pkg-config rpm-build dpkg binutils file
          # rustup refuses a $HOME that differs from root's home (/github/home vs /root).
          echo "HOME=/root" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Require update signing key
        shell: bash
        run: test -n "$KW_UPDATE_PUBKEY" || { echo "::error::set repository variable KW_UPDATE_PUBKEY"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --profile dist --target ${{ matrix.target }} -p kw-app -p kw-cli

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; fi
          echo "KW_VERSION=$v" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/dist
          version="$KW_VERSION"
          case "${{ runner.os }}" in
            macOS)
              scripts/bundle-macos.sh "$bin/kubernet-wizard" "$version" \
                "dist/kubernet-wizard-${{ matrix.platform }}.app.tar.gz" "dist/kubernet-wizard-${{ matrix.platform }}.dmg"
              cp "$bin/kw" "dist/kw-${{ matrix.platform }}" ;;
            Linux)
              cp "$bin/kubernet-wizard" "dist/kubernet-wizard-${{ matrix.platform }}"
              cp "$bin/kw" "dist/kw-${{ matrix.platform }}"
              # Launcher entry + icons (assets/linux/install.sh).
              mkdir -p desktop/kubernet-wizard
              cp assets/linux/* desktop/kubernet-wizard/
              cp -r assets/icon/hicolor desktop/kubernet-wizard/
              tar -C desktop -czf "dist/kubernet-wizard-linux-desktop.tar.gz" kubernet-wizard
              # Installers: .deb and .rpm.
              scripts/package-linux.sh "$bin/kubernet-wizard" "$bin/kw" "$version" dist ;;
            Windows)
              cp "$bin/kubernet-wizard.exe" "dist/kubernet-wizard-${{ matrix.platform }}.exe"
              cp "$bin/kw.exe" "dist/kw-${{ matrix.platform }}.exe" ;;
          esac

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$env:KW_VERSION" "/DSourceDir=$PWD\target\${{ matrix.target }}\dist" "/DOutputDir=$PWD\dist" assets\windows\kubernet-wizard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Sign artifacts and catalog
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "::error::set secret MINISIGN_SECRET_KEY"; exit 1; }
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          cp release/catalog.json dist/catalog.json
          for f in dist/*; do
            case "$f" in *.minisig) continue ;; esac
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "kubernet-wizard $GITHUB_REF_NAME $(basename "$f")"
          done
          rm -f "$RUNNER_TEMP/minisign.key"

      - name: Update manifest
        run: |
          git log -1 --format=%B "$GITHUB_REF_NAME" > notes.md
          python3 scripts/make-manifest.py "$GITHUB_REF_NAME" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" dist notes.md > dist/latest.json

      - name: Publish release
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then pre=--prerelease; else pre=--latest; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $pre

      - name: Update rolling beta feed
        # Beta users receive both prereleases and stable releases.
        run: |
          gh release view beta >/dev/null 2>&1 || \
            gh release create beta --prerelease --title "Beta channel" --notes "Rolling beta update feed." --target "$GITHUB_SHA"
          gh release upload beta dist/latest.json --clobber
