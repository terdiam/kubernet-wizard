- name: Install base packages (Debian family)
  ansible.builtin.apt:
    name: [curl, ca-certificates, gnupg, conntrack, socat, ipset, ipvsadm, nfs-common, open-iscsi, chrony, jq]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: kw_os_family == "debian"

- name: Install base packages (RedHat family)
  ansible.builtin.dnf:
    name: [curl, ca-certificates, conntrack-tools, socat, ipset, ipvsadm, nfs-utils, iscsi-initiator-utils, chrony, jq, tar]
    state: present
  when: kw_os_family == "redhat"

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Kernel modules required by Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
      {% if kw_kube_proxy == 'ipvs' %}ip_vs
      ip_vs_rr
      nf_conntrack{% endif %}
    mode: "0644"

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ ['overlay', 'br_netfilter'] + (['ip_vs', 'ip_vs_rr', 'nf_conntrack'] if kw_kube_proxy == 'ipvs' else []) }}"

- name: Base networking sysctl
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
    reload: true
  loop: "{{ {'net.ipv4.ip_forward': 1, 'net.bridge.bridge-nf-call-iptables': 1, 'net.bridge.bridge-nf-call-ip6tables': 1} | dict2items }}"

- name: SELinux permissive (RHEL family)
  ansible.posix.selinux:
    policy: targeted
    state: permissive
  when: kw_os_family == "redhat"

- name: Stop firewalld (rules managed by CNI)
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when: kw_os_family == "redhat"
  failed_when: false

- name: Enable chrony
  ansible.builtin.systemd:
    name: "{{ 'chrony' if kw_os_family == 'debian' else 'chronyd' }}"
    state: started
    enabled: true
