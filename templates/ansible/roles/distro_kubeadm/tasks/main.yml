- name: Kubernetes minor version
  ansible.builtin.set_fact:
    kw_minor: "{{ kw_version | regex_replace('^v?(\\d+\\.\\d+).*$', '\\1') }}"

- name: pkgs.k8s.io key (Debian family)
  ansible.builtin.shell: |
    set -o pipefail
    mkdir -p /etc/apt/keyrings
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kw_minor }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/kubernetes.gpg
  when: kw_os_family == "debian"

- name: pkgs.k8s.io repo (Debian family)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kw_minor }}/deb/ /"
    filename: kubernetes
  when: kw_os_family == "debian"

- name: pkgs.k8s.io repo (RedHat family)
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kw_minor }}/rpm/"
    gpgkey: "https://pkgs.k8s.io/core:/stable:/v{{ kw_minor }}/rpm/repodata/repomd.xml.key"
    gpgcheck: true
  when: kw_os_family == "redhat"

- name: Install kubeadm, kubelet, kubectl
  ansible.builtin.package:
    name: [kubeadm, kubelet, kubectl]
    state: present

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: Already joined?
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kw_joined

# ---------------------------------------------------------------- first CP
- name: First control plane
  when: kw_first_cp | default(false) and not kw_joined.stat.exists
  block:
    - name: kubeadm config
      ansible.builtin.template:
        src: kubeadm-config.yaml.j2
        dest: /etc/kubernetes/kubeadm-config.yaml
        mode: "0600"

    - name: kubeadm init
      ansible.builtin.command: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
      changed_when: true

    - name: kube-vip back to admin.conf after init
      ansible.builtin.replace:
        path: "{{ kw_static_pods_dir }}/kube-vip.yaml"
        regexp: 'super-admin.conf'
        replace: 'admin.conf'
      when: kw_endpoint_mode == 'kube_vip'

# ---------------------------------------------------------------- joiners
- name: Join node
  when: not (kw_first_cp | default(false)) and not kw_joined.stat.exists
  block:
    - name: Join command from first CP
      ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
      register: kw_join
      delegate_to: "{{ groups['control_plane'][0] }}"
      changed_when: false

    - name: Fresh certificate key (control planes)
      ansible.builtin.shell: |
        set -o pipefail
        kubeadm init phase upload-certs --upload-certs 2>/dev/null | tail -1
      args:
        executable: /bin/bash
      register: kw_cert_key
      delegate_to: "{{ groups['control_plane'][0] }}"
      when: inventory_hostname in groups['control_plane']
      changed_when: false
      no_log: true

    - name: kubeadm join
      ansible.builtin.command: >-
        {{ kw_join.stdout }}
        {% if inventory_hostname in groups['control_plane'] %}--control-plane --certificate-key {{ kw_cert_key.stdout }}{% endif %}
      changed_when: true
      no_log: true
