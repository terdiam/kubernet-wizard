- name: Install Argo CD
  ansible.builtin.include_role:
    name: helm_bootstrap
    tasks_from: release.yml
  vars:
    rel:
      name: argocd
      repo: https://argoproj.github.io/argo-helm
      chart: argo-cd
      namespace: argocd
      values:
        - "dex.enabled=false"
        - "notifications.enabled=false"
        - "applicationSet.replicas=1"
        - "configs.params.server\\.insecure=true"

- name: Root application (app-of-apps)
  ansible.builtin.copy:
    dest: /root/kw-argocd-root.yaml
    mode: "0600"
    content: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: { name: root, namespace: argocd }
      spec:
        project: default
        source:
          repoURL: "{{ kw_gitops_repo }}"
          targetRevision: "{{ kw_gitops_branch }}"
          path: "{{ kw_gitops_path }}"
          directory: { recurse: true }
        destination: { server: https://kubernetes.default.svc, namespace: argocd }
        syncPolicy:
          automated: { prune: true, selfHeal: true }
          syncOptions: [CreateNamespace=true, ServerSideApply=true]

- name: Apply root application
  ansible.builtin.command: "{{ kw_kubectl }} --kubeconfig {{ kw_kubeconfig }} apply -f /root/kw-argocd-root.yaml"
  changed_when: false
