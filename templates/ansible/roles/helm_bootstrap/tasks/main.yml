- name: Check helm
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: kw_helm

- name: Install helm
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    executable: /bin/bash
  when: not kw_helm.stat.exists
  changed_when: true

- name: Wait for API through stable endpoint
  ansible.builtin.command: "{{ kw_kubectl }} --kubeconfig {{ kw_kubeconfig }} get --raw=/readyz"
  register: kw_ready
  until: kw_ready.rc == 0
  retries: 60
  delay: 5
  changed_when: false
